<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTĐZAI - FreeFire Config Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 2px solid #00ff41;
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,255,65,0.2);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 15px;
            margin-bottom: 25px;
            color: #00ff41;
            text-shadow: 0 0 15px rgba(0,255,65,0.4);
        }
        .status {
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #00ff41;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .status span {
            color: #00cc33;
        }
        .badge {
            background: #00ff41;
            color: #0a0a0a;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .config-preview {
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 18px;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            color: #b0ffb0;
            line-height: 1.6;
        }
        .config-preview::-webkit-scrollbar {
            width: 6px;
        }
        .config-preview::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .config-preview::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 18px 0;
        }
        .btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 10px 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0,255,65,0.05);
        }
        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0,255,65,0.4);
        }
        .btn-danger {
            border-color: #ff0040;
            color: #ff0040;
            background: rgba(255,0,64,0.05);
        }
        .btn-danger:hover {
            background: #ff0040;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(255,0,64,0.4);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            font-size: 13px;
            border-top: 1px solid #2a2a2a;
            padding-top: 20px;
        }
        .info-item {
            background: #0d0d0d;
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid #00ff41;
        }
        .info-item .label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-item .value {
            color: #00ff41;
            font-weight: bold;
            margin-top: 4px;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #444;
            letter-spacing: 2px;
            border-top: 1px solid #1a1a1a;
            padding-top: 18px;
        }
        .footer strong {
            color: #00ff41;
        }
        @media (max-width: 600px) {
            .container { padding: 18px; }
            .info-grid { grid-template-columns: 1fr; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ VTĐZAI · CONFIG LOADER</h1>
        
        <div class="status">
            <span>🔹 Trạng thái: <span id="statusText">Sẵn sàng</span></span>
            <span class="badge" id="versionBadge">v1.0 · AIMLOCK+DRAG</span>
        </div>

        <div class="config-preview" id="configDisplay">
            // Đang tải cấu hình...
        </div>

        <div class="controls">
            <button class="btn" id="loadBtn">📂 TẢI CONFIG</button>
            <button class="btn" id="applyBtn">✅ ÁP DỤNG VÀO GAME</button>
            <button class="btn btn-danger" id="resetBtn">⟳ RESET MẶC ĐỊNH</button>
            <button class="btn" id="exportBtn">💾 XUẤT FILE .JSON</button>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="label">AIMLOCK</div>
                <div class="value" id="aimlockStatus">BẬT · Ưu tiên gần nhất</div>
            </div>
            <div class="info-item">
                <div class="label">AIMDRAG</div>
                <div class="value" id="aimdragStatus">BẬT · Hệ số 0.0</div>
            </div>
            <div class="info-item">
                <div class="label">ỔN ĐỊNH</div>
                <div class="value" id="stabilityStatus">Không rung · Không lố · Bám đầu</div>
            </div>
            <div class="info-item">
                <div class="label">PHÍM TẮT</div>
                <div class="value" id="hotkeyStatus">F1 · F2 · F3</div>
            </div>
        </div>

        <div class="footer">
            <strong>VTĐZAI</strong> · Bản quyền thuộc về Đế chế · Mọi hành động vì sự tồn vong
        </div>
    </div>

    <script>
        (function() {
            // Cấu hình mặc định - khớp với config.json
            const DEFAULT_CONFIG = {
                "version": "1.0.0",
                "game": "FreeFire",
                "features": {
                    "aimbot": {
                        "enable": true,
                        "aimlock": {
                            "enable": true,
                            "priority": "nearest",
                            "smoothness": 0.0,
                            "lock_after_shot": true,
                            "reset_delay_ms": 50
                        },
                        "aimdrag": {
                            "enable": true,
                            "drag_speed_x": 0.0,
                            "drag_speed_y": 0.0,
                            "drag_zone_percent": 0.0,
                            "auto_correct": true
                        },
                        "recoil_control": {
                            "enable": true,
                            "vertical_reduction": 1.0,
                            "horizontal_reduction": 1.0,
                            "pattern": "none"
                        },
                        "targeting": {
                            "fov_radius": 360,
                            "max_distance": 500.0,
                            "head_priority": false,
                            "body_part": "chest",
                            "visible_check": false
                        }
                    },
                    "stability": {
                        "no_shake": true,
                        "no_bounce": true,
                        "no_over_shoot": true,
                        "sticky_aim": true,
                        "sticky_factor": 1.0
                    },
                    "sensitivity": {
                        "override": true,
                        "general": 0.0,
                        "red_dot": 0.0,
                        "2x_scope": 0.0,
                        "4x_scope": 0.0,
                        "sniper_scope": 0.0,
                        "free_look": 0.0
                    },
                    "input": {
                        "mouse": {
                            "dpi": 0,
                            "polling_rate": 1000,
                            "raw_input": true
                        },
                        "touch": {
                            "dead_zone": 0.0,
                            "swipe_speed": 0.0
                        }
                    },
                    "memory": {
                        "scan_interval_ms": 16,
                        "write_delay_ms": 1,
                        "use_physical_address": true
                    }
                },
                "hotkeys": {
                    "toggle_aimbot": "F1",
                    "toggle_aimlock": "F2",
                    "toggle_aimdrag": "F3",
                    "increase_fov": "NUMPAD_ADD",
                    "decrease_fov": "NUMPAD_SUBTRACT"
                },
                "logging": {
                    "enable": false,
                    "level": "error",
                    "file": "vtd_aim.log"
                }
            };

            let currentConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

            // DOM refs
            const configDisplay = document.getElementById('configDisplay');
            const statusText = document.getElementById('statusText');
            const aimlockStatus = document.getElementById('aimlockStatus');
            const aimdragStatus = document.getElementById('aimdragStatus');
            const stabilityStatus = document.getElementById('stabilityStatus');
            const hotkeyStatus = document.getElementById('hotkeyStatus');

            // Helper: render config ra màn hình
            function renderConfig() {
                configDisplay.textContent = JSON.stringify(currentConfig, null, 4);
                // Cập nhật status widgets
                const f = currentConfig.features;
                aimlockStatus.textContent = (f.aimbot.aimlock.enable ? 'BẬT' : 'TẮT') + 
                    ' · Ưu tiên ' + f.aimbot.aimlock.priority;
                aimdragStatus.textContent = (f.aimbot.aimdrag.enable ? 'BẬT' : 'TẮT') + 
                    ' · Hệ số ' + f.aimbot.aimdrag.drag_speed_x.toFixed(1);
                const stab = f.stability;
                const stableParts = [];
                if (stab.no_shake) stableParts.push('Không rung');
                if (stab.no_bounce) stableParts.push('Không lố');
                if (stab.sticky_aim) stableParts.push('Bám đầu');
                stabilityStatus.textContent = stableParts.join(' · ') || 'Mặc định';
                const hk = currentConfig.hotkeys;
                hotkeyStatus.textContent = hk.toggle_aimbot + ' · ' + hk.toggle_aimlock + ' · ' + hk.toggle_aimdrag;
                statusText.textContent = 'Đã tải · ' + new Date().toLocaleTimeString();
            }

            // Load config từ file .json
            function loadConfigFromFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            // Merge sâu (đơn giản: ghi đè lên default)
                            currentConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                            // Merge thủ công để giữ cấu trúc
                            for (let key in data) {
                                if (data.hasOwnProperty(key) && typeof data[key] === 'object' && !Array.isArray(data[key])) {
                                    for (let sub in data[key]) {
                                        if (data[key].hasOwnProperty(sub) && typeof data[key][sub] === 'object' && !Array.isArray(data[key][sub])) {
                                            for (let sub2 in data[key][sub]) {
                                                if (data[key][sub].hasOwnProperty(sub2)) {
                                                    currentConfig[key][sub][sub2] = data[key][sub][sub2];
                                                }
                                            }
                                        } else {
                                            currentConfig[key][sub] = data[key][sub];
                                        }
                                    }
                                } else {
                                    currentConfig[key] = data[key];
                                }
                            }
                            renderConfig();
                            statusText.textContent = 'Đã tải file: ' + file.name;
                        } catch (err) {
                            statusText.textContent = 'LỖI: JSON không hợp lệ';
                            configDisplay.textContent = '// LỖI PARSE: ' + err.message;
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            // Áp dụng vào game (simulate injection)
            function applyToGame() {
                statusText.textContent = 'ĐANG ÁP DỤNG...';
                try {
                    // Giả lập ghi vào memory
                    const jsonStr = JSON.stringify(currentConfig);
                    // Ở đây trong thực tế sẽ inject vào process
                    // Ví dụ: gửi qua WebSocket hoặc IPC
                    console.log('[VTĐZAI] INJECT CONFIG:', jsonStr);
                    // Giả lập delay
                    setTimeout(() => {
                        statusText.textContent = '✅ ĐÃ ÁP DỤNG THÀNH CÔNG vào FreeFire';
                    }, 300);
                } catch (e) {
                    statusText.textContent = '❌ LỖI ÁP DỤNG: ' + e.message;
                }
            }

            // Reset về mặc định
            function resetConfig() {
                currentConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                renderConfig();
                statusText.textContent = 'Đã reset về cấu hình mặc định';
            }

            // Xuất file .json
            function exportConfig() {
                const jsonStr = JSON.stringify(currentConfig, null, 4);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'config_vtd_freefire.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusText.textContent = 'Đã xuất file config_vtd_freefire.json';
            }

            // Gán sự kiện
            document.getElementById('loadBtn').addEventListener('click', loadConfigFromFile);
            document.getElementById('applyBtn').addEventListener('click', applyToGame);
            document.getElementById('resetBtn').addEventListener('click', resetConfig);
            document.getElementById('exportBtn').addEventListener('click', exportConfig);

            // Khởi tạo hiển thị
            renderConfig();
            statusText.textContent = 'Sẵn sàng · Chờ lệnh';
        })();
    </script>
</body>
</html>
