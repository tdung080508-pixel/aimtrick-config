<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VTĐZAI Config Server</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ VTĐZAI CONFIG SERVER</h1>
            <p class="subtitle">FreeFire Aim Config v1.0.0</p>
        </header>
        <main>
            <div class="status-card">
                <div class="status-indicator" id="statusDot"></div>
                <span id="statusText">Server đang chạy</span>
            </div>
            <div class="config-panel">
                <h2>Cấu hình hiện tại</h2>
                <pre id="configDisplay">Đang tải...</pre>
                <div class="btn-group">
                    <button id="refreshBtn">⟳ Tải lại</button>
                    <button id="exportBtn">⬇ Tải config.json</button>
                </div>
            </div>
            <div class="info-panel">
                <h3>API Endpoints</h3>
                <ul>
                    <li><span class="method">GET</span> /api/config → Trả về config</li>
                    <li><span class="method">POST</span> /api/apply → Áp dụng config</li>
                    <li><span class="method">GET</span> /config/v1.0.0.json → File config thô</li>
                </ul>
            </div>
        </main>
        <footer>
            <p>VTĐZAI EMPIRE &bull; Bản quyền thuộc về Đế chế</p>
        </footer>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
